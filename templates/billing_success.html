<!DOCTYPE html>
<html lang="en">
<head>
{% if conversion %}
<script>
  // Purchase event for GTM, pushed BEFORE the container loads and only once per
  // Checkout Session (a refresh or revisit must not count the sale again).
  window.dataLayer = window.dataLayer || [];
  (function () {
    var c = {{ conversion|tojson }}, key = 'gtm_purchase_' + c.transaction_id;
    try { if (localStorage.getItem(key)) return; localStorage.setItem(key, '1'); } catch (e) {}
    window.dataLayer.push({
      event: 'purchase',
      plan: c.plan,
      ecommerce: {
        transaction_id: c.transaction_id,
        value: c.value,
        currency: c.currency,
        items: [{ item_name: c.plan, price: c.value, quantity: 1 }]
      }
    });
  })();
</script>
{% endif %}

j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
})(window,document,'script','dataLayer','GTM-MBR687RM');</script>
